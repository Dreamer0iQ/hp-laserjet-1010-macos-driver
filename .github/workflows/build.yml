name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build filter and PPDs
        run: make all check

      - name: End-to-end test (PDF -> CUPS raster -> FastRaster -> PNG)
        run: |
          pip install --quiet pillow
          make test

      - name: Build installer package
        run: make pkg

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            build/*.pkg
            build/test/decoded-p1.png

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/*.pkg --title "$GITHUB_REF_NAME" --generate-notes
